name: Isolated logic proof validation
on:
  push:
    branches: ['proofs/logic-complete-20260927']
    paths: ['.github/workflows/logic-proof-edit.yml', '.logic-review/**']
permissions:
  contents: write
  pull-requests: read
jobs:
  validate:
    if: github.ref == 'refs/heads/proofs/logic-complete-20260927'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded edits and validate locally without committing
        id: edit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          if test -f .logic-review/READY; then
            git switch -c proofs/logic-complete-20260927
            python -m pip install numpy
            python .logic-review/edit_logic.py 2>&1 | tee validation/edit.log
            python tests/check_logic.py 2>&1 | tee validation/check.log
            git diff --check
            git diff -- '集合论/数理逻辑.tex' > validation/source.patch
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Store validated file objects for the existing PR; never move any branch
        if: steps.edit.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, urllib.request
          base = 'https://api.github.com/repos/ncut-d1z/mathematical-notes'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          def request(path, data=None):
              body = None if data is None else json.dumps(data).encode('utf-8')
              req = urllib.request.Request(base + path, data=body, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          pr = request('/pulls/5')
          assert pr['state'] == 'open' and pr['merged_at'] is None
          assert pr['head']['ref'] == 'proofs/logic-complete-20260927'
          assert pr['base']['ref'] == 'master'
          assert pr['head']['repo']['full_name'] == 'ncut-d1z/mathematical-notes'
          results = []
          for name in ['集合论/数理逻辑.tex', 'tests/check_logic.py', 'tests/check_logic.wl']:
              raw = Path(name).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              obj = request('/git/blobs', {'content': raw.decode('utf-8'), 'encoding': 'utf-8'})
              assert obj['sha'] == expected
              results.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': obj['sha']})
          Path('validation/objects.json').write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(results, ensure_ascii=False, indent=2))
          print('No commits, ref updates, pushes or merges were performed by this workflow.')
          PY
      - name: Collect review sources and diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p validation
          python - <<'PY'
          from pathlib import Path
          import zipfile
          files = list(Path('.').glob('*.sty'))
          files += [Path('prompt.md'), Path('math.tex'), Path('集合论/数理逻辑.tex')]
          files += list(Path('tests').glob('check_logic.*')) if Path('tests').exists() else []
          with zipfile.ZipFile('validation/sources.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  if p.is_file():
                      z.write(p, str(p))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logic-proof-validation
          path: validation/
          retention-days: 7
