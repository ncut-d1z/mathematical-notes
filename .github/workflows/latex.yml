name: Build and Release LaTeX PDF

# PR/主分支构建供下载的产物；只有 v* 标签可以发布 Release。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 编译（包括来自 fork 的 PR）不需要写权限。
permissions:
  contents: read

concurrency:
  group: latex-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build PDF (XeLaTeX + Biber)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      pdf-artifact-id: ${{ steps.pdf.outputs.artifact-id }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # 完整发行版包含 ctex/Fandol、biblatex-gb7714-2015 和自定义 sty 的依赖。
      # 固定 TeX Live 年份；不要在构建中混用 apt 与 tlmgr，或更新到另一个年份。
      - name: Compile the complete book
        uses: xu-cheng/latex-action@v4
        with:
          root_file: math.tex
          texlive_version: '2025'
          os: debian
          latexmk_use_xelatex: true
          latexmk_shell_escape: false
          args: -file-line-error -halt-on-error -interaction=nonstopmode -recorder -no-shell-escape
          pre_compile: |
            set -eo pipefail
            test -f math.tex
            test -f math.bib
            xelatex --version
            latexmk -v
            biber --version
            kpsewhich ctexbook.cls
            kpsewhich gb7714-2015.bbx
            kpsewhich FandolSong-Regular.otf
            latexmk -C math.tex
          post_compile: |
            set -eo pipefail
            test -s math.pdf
            test -s math.bbl

      # 不允许用编译失败后留下的残缺 PDF 冒充成功；本步骤只在编译成功后执行。
      - name: Validate and checksum PDF
        shell: bash
        run: |
          set -euo pipefail
          test -s math.pdf
          test "$(head -c 5 math.pdf)" = '%PDF-'
          sha256sum math.pdf > math.pdf.sha256

      - name: Upload compiled PDF
        id: pdf
        uses: actions/upload-artifact@v7
        with:
          name: compiled-pdf
          path: |
            math.pdf
            math.pdf.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Upload compilation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: latex-logs-${{ github.run_attempt }}
          path: |
            math.log
            math.blg
            math.bcf
            math.fls
            math.fdb_latexmk
          if-no-files-found: ignore
          retention-days: 14

      - name: Report PDF artifact
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.pdf.outputs.artifact-url }}
        run: |
          printf '### PDF build\n\n[Download compiled-pdf](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish PDF release
    needs: build
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 写权限仅授予不执行 LaTeX 源码的发布 job。
    permissions:
      contents: write
    steps:
      - name: Download this build's PDF
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.pdf-artifact-id }}
          path: dist

      - name: Verify downloaded PDF
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          test -s math.pdf
          sha256sum --check math.pdf.sha256

      - name: Create or update tag release
        id: publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/math.pdf
            dist/math.pdf.sha256
          fail_on_unmatched_files: true

      - name: Report release URL
        shell: bash
        env:
          RELEASE_URL: ${{ steps.publish.outputs.url }}
        run: |
          printf '### PDF release\n\n[Open release](%s)\n' "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
